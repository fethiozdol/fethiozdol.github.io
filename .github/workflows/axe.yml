name: Axe accessibility testing

on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Space-separated paths to check (e.g.: /blog/ /cv/). Leave empty for the main pages."
        required: false

permissions:
  contents: read

env:
  PATHS: ${{ github.event.inputs.paths || '/ /blog/ /blog/2024/ht-startup-w-devops-p01/ /cv/ /news/ /search/ /terms/ /cookies/' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run axe
        run: |
          npm run preview -- --port 8080 &
          npx --yes wait-on http://localhost:8080/
          urls=""
          for path in $PATHS; do urls="$urls http://localhost:8080$path"; done
          npx --yes @axe-core/cli@4 $urls --chromedriver-path "$CHROMEWEBDRIVER/chromedriver" --load-delay=1500 --exit
